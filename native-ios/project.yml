name: Counter
options:
  bundleIdPrefix: com.connorbyers
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Counter:
    type: application
    platform: iOS
    sources: [Counter]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.connorbyers.counter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Counter
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your Etekcity food and bathroom scales to save food grams and body weigh-ins separately.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan packaged food barcodes.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe food descriptions as you speak so they are ready when you tap Stop.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record food descriptions for transcription.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
